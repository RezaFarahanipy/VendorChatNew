name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build
        shell: bash
        run: gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Save error summary to branch build-log
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|What went wrong|FAILURE|Execution failed|Caused by" -A3 build.log | head -200 > /tmp/ERRORS.txt || true
          echo "commit: ${GITHUB_SHA}" >> /tmp/ERRORS.txt
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan build-log
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/ERRORS.txt ERRORS.txt
          git add ERRORS.txt
          git commit -m "build errors for ${GITHUB_SHA::7}"
          git push -f origin build-log
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk VendorChat.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest VendorChat.apk --title "VendorChat (آخرین بیلد)" --notes "آخرین APK ساخته‌شده. commit ${GITHUB_SHA::7}" --target "$GITHUB_SHA"
